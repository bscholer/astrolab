name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            base: debian:bookworm-slim
          - variant: cuda
            base: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CPU variant: :latest (on main), :cpu, :vX.Y.Z (on tag), :vX.Y.Z-cpu (on tag)
      - name: Compute tags (cpu)
        if: matrix.variant == 'cpu'
        id: meta-cpu
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/bscholer/astrolab
            ghcr.io/bscholer/astrolab
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=cpu
            type=semver,pattern=v{{version}},enable={{is_tag}}
            type=semver,pattern=v{{version}}-cpu,enable={{is_tag}}

      # CUDA variant: :cuda (on main), :vX.Y.Z-cuda (on tag)
      - name: Compute tags (cuda)
        if: matrix.variant == 'cuda'
        id: meta-cuda
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/bscholer/astrolab
            ghcr.io/bscholer/astrolab
          tags: |
            type=raw,value=cuda
            type=semver,pattern=v{{version}}-cuda,enable={{is_tag}}

      - name: Build and push (cpu)
        if: matrix.variant == 'cpu'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: BASE=${{ matrix.base }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-cpu.outputs.tags }}
          labels: ${{ steps.meta-cpu.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.variant }}

      - name: Build and push (cuda)
        if: matrix.variant == 'cuda'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: BASE=${{ matrix.base }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-cuda.outputs.tags }}
          labels: ${{ steps.meta-cuda.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.variant }}
