name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A single failing job shouldn't kill the rest. Set fail-fast: false on the
# matrix below if we ever expand it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest
        # Siril is not available on the runner; the one Siril smoke test in
        # the suite skips itself when it can't find a binary, which is what
        # we want here.
        run: uv run pytest -q -n auto

  ui:
    name: svelte-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Build
        run: npm run build

  deploy:
    name: trigger box deploy
    needs: [python, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Concurrency on main keeps multiple in-flight merges from racing the
    # box: only the latest push gets through; older ones wait, then the
    # newest one fires once the previous deploy finishes (or get
    # cancelled if a newer commit lands first).
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - name: POST /api/_deploy
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.ASTROLAB_DEPLOY_CF_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.ASTROLAB_DEPLOY_CF_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_ACCESS_CLIENT_ID:-}" || -z "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            echo "::error::ASTROLAB_DEPLOY_CF_CLIENT_ID / ASTROLAB_DEPLOY_CF_CLIENT_SECRET not set"
            exit 1
          fi
          # The webhook returns 202 the moment astrolab-deploy.service is
          # queued; the actual pull/build/restart runs out-of-band. We
          # don't wait for it here because the API is going to restart
          # itself partway through. -w prints status + content type +
          # body size so a CF Access HTML interception (which also
          # returns 200 in some configs) is visible at a glance. Also
          # echo a trimmed prefix of the body so we can spot a CF login
          # page vs a real {"status":"queued"}.
          tmp="$(mktemp)"
          status=$(curl -sS -X POST \
            -o "$tmp" \
            -w "%{http_code}" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://astrolab.benscholer.com/api/_deploy)
          ctype=$(file -b --mime-type "$tmp" 2>/dev/null || echo unknown)
          size=$(wc -c < "$tmp")
          echo "status=$status content-type=$ctype size=$size"
          echo "---response body (first 500 bytes)---"
          head -c 500 "$tmp" | tr -d '\r' || true
          echo
          echo "---"
          if [[ "$status" != "202" ]]; then
            echo "::error::expected 202 from /api/_deploy, got $status"
            exit 1
          fi
          # Reject HTML responses even when status is 2xx: that's CF
          # Access showing a login page through the tunnel pretending to
          # be the origin. A real 202 is JSON.
          if [[ "$ctype" == "text/html" ]]; then
            echo "::error::got HTML body, almost certainly intercepted by CF Access"
            exit 1
          fi
