id: stack_per_night_duo
version: 4
description: |
  Stack per night for duo-band (H-alpha + OIII) data on a colour camera.
  Each night is calibrated without debayering, split into H-alpha (red
  pixels) and OIII (green and blue pixels) by seqextract_HaOIII after
  the same small pedestal stack_per_night adds, and each
  channel is registered and stacked on its own (narrowband_extract). The
  night's two stacks are packed into one RGB image (red H-alpha, green and
  blue OIII), and from there it is stack_per_night: combine_stacks joins
  the nights, then the same finishing steps, with HOO colour on and SCNR
  green removal off.

  Why split before debayering: the demosaic fills each pixel's missing
  colours from its neighbours using the other channels' detail, so on a
  debayered stack green and blue carry H-alpha's structure. Measured on the
  California Nebula, debayered green+blue was 1.02 x red with almost
  nothing of its own; split first, OIII and H-alpha correlate at about 0.3.
  HOO from the debayered stack can only ever come out red.

  Inputs the Job must supply, per night:
    convert@<session>.lights   the night's raw subs
    calibrate@<session>.dark   matched master darks

nodes:
  - id: convert
    per_session: true
    kind: convert_lights
    params:
      basename: light
      fitseq: false

  - id: calibrate
    per_session: true
    kind: calibrate
    params:
      input_basename: light
      fitseq: false
      cfa: true
      equalize_cfa: true
      # The Bayer pattern must stay intact: seqextract_HaOIII reads it.
      debayer: false
      cosmetic: true
    inputs:
      sequence: convert.sequence

  - id: offset
    per_session: true
    kind: seq_offset
    # Dark subtraction leaves the CFA frames mostly below zero (measured
    # around -0.003 on California); the finishing steps clip negatives to
    # black and the nebula with them. Same pedestal as stack_per_night.
    params:
      input_basename: pp_light
      fitseq: false
      pedestal: 0.01
    inputs:
      sequence: calibrate.sequence

  - id: extract
    per_session: true
    kind: narrowband_extract
    # Split into H-alpha and OIII, register the OIII frames (they have the
    # stars) and apply the same transforms to H-alpha, then stack both. The
    # expensive step; cached per night.
    params:
      input_basename: pp_light
      fitseq: false
      shared_registration: true
    inputs:
      sequence: offset.sequence

  - id: pack
    per_session: true
    kind: narrowband_pack
    inputs:
      ha: extract.ha
      oiii: extract.oiii

  - id: combine
    kind: combine_stacks
    # Joins the nightly stacks. One night passes straight through.
    inputs:
      images: pack.image

  - id: crop
    kind: crop
    # Your framing, right after the stack so GraXpert, the HOO colour and the
    # stretch measure only what you framed. Set in the editor, stored on the
    # sky (centre, size, angle) and placed through the plate solve, so it
    # keeps framing the same nebula when a new night grows or shifts the
    # combined canvas. With no box set it only trims rows and columns with no
    # data at all.
    params:
      enabled: true
      threshold: 0.001
      padding: 0
    inputs:
      image: combine.image

  - id: graxpert_bg
    kind: graxpert
    # GraXpert AI background extraction. Off by default; flip on if Siril's
    # polynomial bg_extract leaves residual gradient or you have a tough
    # light-pollution sky. Runs on linear (pre-stretch) data, where the
    # background model is cleanest.
    params:
      enabled: false
      mode: bg_extract
      smoothing: 0.0
      correction: Subtraction
    inputs:
      image: crop.image

  - id: graxpert_denoise
    kind: graxpert
    # GraXpert AI denoise. Off by default. Strength 0.4-0.6 is the typical
    # sweet spot. Runs on linear data: GraXpert's noise model is fit on
    # pre-stretch distributions, and stretching after denoise keeps the
    # denoiser from over-smoothing the boosted shadow noise.
    params:
      enabled: false
      mode: denoise
      strength: 0.5
    inputs:
      image: graxpert_bg.image

  - id: channel_map
    kind: channel_map
    # False colour for duo-band data on a colour camera: HOO maps red to
    # H-alpha and green and blue to OIII. Off by default; the Quick panel's
    # HOO switch turns it on. Turn color_balance off with it, or SCNR eats
    # the OIII.
    params:
      enabled: true
    inputs:
      image: graxpert_denoise.image

  - id: color_balance
    kind: color_balance
    # SCNR green (rmgreen) to kill the OSC Bayer-matrix green cast. Runs
    # in the linear domain so the subsequent autostretch curve operates
    # on color-neutral data instead of amplifying the green wash into a
    # permanent stained look. On by default for OSC; flip off for targets
    # where green emission is genuinely present.
    params:
      enabled: false
      amount: 0.85
    inputs:
      image: channel_map.image

  - id: auto_bp_shift
    kind: auto_bp_shift
    # Linear black-point shift sized to a target clip fraction. The
    # canonical first move of a manual GHS workflow, automated: push BP
    # up until ~1% of pixels fall below it, then linearly rescale. The
    # downstream stretch (autostretch / mtf / asinh) sees a histogram
    # with the background already crushed toward zero, so its tone
    # curve doesn't have to do as much work.
    params:
      enabled: true
      clip_fraction: 0.01
    inputs:
      image: color_balance.image

  - id: stretch
    kind: stretch
    # Linear-domain processing ends here. Everything below operates on
    # stretched data (StarNet was trained on stretched 16-bit images).
    # target_bg dropped from the Siril default (0.25) to 0.05 because
    # auto_bp_shift already pushed the background toward zero; leaving
    # target_bg at 0.25 would lift the BG back up and undo the shift.
    params:
      method: autostretch
      target_bg: 0.05
    inputs:
      image: auto_bp_shift.image

  - id: starnet_extract
    kind: starnet_extract
    # StarNet++ split into starless + stars. Off by default. When off, both
    # outputs are well-defined (starless=input, stars=zero) so the recombine
    # math at the end of the chain stays consistent.
    params:
      enabled: false
    inputs:
      image: stretch.image

  - id: starnet_replace
    kind: starnet_replace
    # Siril findstar+synthstar to regenerate clean Gaussian stars. Off by
    # default — passes the StarNet stars layer through unchanged.
    params:
      enabled: false
    inputs:
      starless: starnet_extract.starless
      stars: starnet_extract.stars
    # Surface this row only when the starless workflow is on — synthstar
    # regen is meaningless when stars haven't been extracted.
    ui_depends_on: starnet_extract

  - id: starnet_recombine
    kind: starnet_recombine
    # Recombine starless + (regenerated) stars. On by default; with extract
    # off the inputs are (input, zero-image) so this is a no-op identity.
    params:
      enabled: true
      blend: add
    inputs:
      starless: starnet_extract.starless
      stars: starnet_replace.image
    # Hide along with replace so the whole starless workflow lives or dies
    # as a unit; replace already gates on extract, so this transitively
    # disappears when extract is off.
    ui_depends_on: starnet_replace

  - id: save
    kind: save_image
    inputs:
      image: starnet_recombine.image

outputs:
  image: save.image
  stacked: combine.image
  stretched: stretch.image
  cropped: crop.image
  starless: starnet_extract.starless
  stars: starnet_replace.image
  recombined: starnet_recombine.image
