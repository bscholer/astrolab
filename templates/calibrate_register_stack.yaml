id: calibrate_register_stack
version: 6
description: |
  OSC smart-telescope pipeline mirrored on Naztronomy's Siril script:
    convert -> calibrate (CFA-aware, debayer) -> resample (default 1.0)
            -> pedestal offset -> background extract -> plate-solve
            register -> rejection stack with rgb_equal -> auto_crop (trim
            registration nodata) -> stretch (autostretch by default)
            -> crop (interactive composition crop, off by default)
            -> save 16-bit PNG.

  Pull resample.scale down (e.g. 0.5) for fast iteration on
  pedestal/stretch/rejection params; bump back to 1.0 for the final
  render. Each scale has its own cache lineage so flipping is cheap
  once both have been built.

  The pedestal offset between resample and bg_extract pushes any
  near-zero negatives back into positive territory; Siril 1.4's
  seqsubsky refuses to operate on negative pixel data, and OSC factory
  darks (Dwarf 3 et al.) routinely leave a faint sky just under zero.
  Inputs the Job must supply:
    convert.lights  -> a directory of raw .fits subs (typically a Dwarf 3 session folder)
    calibrate.dark  -> a master_dark .fits matched on instrument/exptime/gain/temp

nodes:
  - id: convert
    kind: convert_lights
    params:
      basename: light
      fitseq: false

  - id: calibrate
    kind: calibrate
    params:
      input_basename: light
      fitseq: false
      # cfa, equalize_cfa, debayer, cosmetic all default-on for OSC.
    inputs:
      sequence: convert.sequence

  - id: resample
    kind: seq_resample
    params:
      input_basename: pp_light
      fitseq: false
      mode: full
      # Flip mode to 'draft' in the UI for fast iteration (~4x speedup);
      # back to 'full' for the final render. Both lineages stay cached.
    inputs:
      sequence: calibrate.sequence

  - id: offset
    kind: seq_offset
    params:
      input_basename: rs_pp_light
      fitseq: false
      pedestal: 0.01
    inputs:
      sequence: resample.sequence

  - id: bg_extract
    kind: seq_bg_extract
    params:
      input_basename: rs_pp_light
      fitseq: false
      degree: 1
      samples: 10
    inputs:
      sequence: offset.sequence

  - id: register
    kind: seq_register
    params:
      input_basename: bkg_rs_pp_light
      fitseq: false
      method: platesolve
    inputs:
      sequence: bg_extract.sequence

  - id: stack
    kind: seq_stack
    params:
      input_basename: r_bkg_rs_pp_light
      fitseq: false
      method: rej
      # rgb_equal / maximize / filter_included default-on.
    inputs:
      sequence: register.sequence

  - id: auto_crop
    kind: auto_crop
    # Trim the zero-fill border that registration leaves around the stack so
    # stretch + save read a smaller, all-real-data frame. Threshold + padding
    # live in advanced; the user toggles on/off if they want the full frame.
    params:
      enabled: true
      threshold: 0.001
      padding: 0
    inputs:
      image: stack.image

  - id: stretch
    kind: stretch
    params:
      method: autostretch
      # autostretch with Siril defaults: linked, shadows_clip=-2.8, target_bg=0.25.
    inputs:
      image: auto_crop.image

  - id: crop
    kind: crop
    # Interactive composition crop. Off by default — flips on once the user
    # drags a rectangle in the project page UI. Coords are normalized [0,1]
    # so the box stays valid across resample modes.
    params:
      enabled: false
    inputs:
      image: stretch.image

  - id: save
    kind: save_image
    inputs:
      image: crop.image

outputs:
  image: save.image
  stacked: stack.image
  stretched: stretch.image
  auto_cropped: auto_crop.image
  cropped: crop.image
