id: calibrate_register_stack
version: 4
description: |
  OSC smart-telescope pipeline mirrored on Naztronomy's Siril script:
    convert -> calibrate (CFA-aware, debayer) -> pedestal offset
            -> background extract -> plate-solve register
            -> rejection stack with rgb_equal -> stretch (autostretch by
            default) -> save 16-bit PNG.

  The pedestal offset between calibrate and bg_extract pushes any
  near-zero negatives back into positive territory; Siril 1.4's
  seqsubsky refuses to operate on negative pixel data, and OSC factory
  darks (Dwarf 3 et al.) routinely leave a faint sky just under zero.
  Inputs the Job must supply:
    convert.lights  -> a directory of raw .fits subs (typically a Dwarf 3 session folder)
    calibrate.dark  -> a master_dark .fits matched on instrument/exptime/gain/temp

nodes:
  - id: convert
    kind: convert_lights
    params:
      basename: light
      fitseq: false

  - id: calibrate
    kind: calibrate
    params:
      input_basename: light
      fitseq: false
      # cfa, equalize_cfa, debayer, cosmetic all default-on for OSC.
    inputs:
      sequence: convert.sequence

  - id: offset
    kind: seq_offset
    params:
      input_basename: pp_light
      fitseq: false
      pedestal: 0.01
    inputs:
      sequence: calibrate.sequence

  - id: bg_extract
    kind: seq_bg_extract
    params:
      input_basename: pp_light
      fitseq: false
      degree: 1
      samples: 10
    inputs:
      sequence: offset.sequence

  - id: register
    kind: seq_register
    params:
      input_basename: bkg_pp_light
      fitseq: false
      method: platesolve
    inputs:
      sequence: bg_extract.sequence

  - id: stack
    kind: seq_stack
    params:
      input_basename: r_bkg_pp_light
      fitseq: false
      method: rej
      # rgb_equal / maximize / filter_included default-on.
    inputs:
      sequence: register.sequence

  - id: stretch
    kind: stretch
    params:
      method: autostretch
      # autostretch with Siril defaults: linked, shadows_clip=-2.8, target_bg=0.25.
    inputs:
      image: stack.image

  - id: save
    kind: save_image
    inputs:
      image: stretch.image

outputs:
  image: save.image
  stacked: stack.image
  stretched: stretch.image
