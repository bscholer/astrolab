id: calibrate_register_stack
version: 9
description: |
  OSC smart-telescope pipeline mirrored on Naztronomy's Siril script:
    convert -> calibrate (CFA-aware, debayer) -> resample (default 1.0)
            -> pedestal offset -> background extract -> plate-solve
            register -> rejection stack with rgb_equal -> auto_crop (trim
            registration nodata) -> graxpert_bg (AI background, optional;
            linear) -> graxpert_denoise (AI denoise, optional; linear)
            -> stretch (autostretch by default) -> starnet_extract (split,
            optional; needs stretched input) -> starnet_replace (synthstar,
            optional) -> starnet_recombine (always on; identity when
            extract is off) -> crop (interactive composition crop, off
            by default) -> save 16-bit PNG.

  Ordering rule: linear-domain ops come before stretch (BG extract and
  GraXpert denoise prefer the noise distribution of pre-stretch data),
  StarNet++ comes after (its model was trained on stretched 16-bit
  data and produces mushy starless results on linear input), and the
  final composition crop sits at the very end so it can be re-tweaked
  without rerunning anything expensive upstream.

  Pull resample.scale down (e.g. 0.5) for fast iteration on
  pedestal/stretch/rejection params; bump back to 1.0 for the final
  render. Each scale has its own cache lineage so flipping is cheap
  once both have been built.

  The pedestal offset between resample and bg_extract pushes any
  near-zero negatives back into positive territory; Siril 1.4's
  seqsubsky refuses to operate on negative pixel data, and OSC factory
  darks (Dwarf 3 et al.) routinely leave a faint sky just under zero.
  Inputs the Job must supply:
    convert.lights  -> a directory of raw .fits subs (typically a Dwarf 3 session folder)
    calibrate.dark  -> a master_dark .fits matched on instrument/exptime/gain/temp

nodes:
  - id: convert
    kind: convert_lights
    params:
      basename: light
      fitseq: false

  - id: calibrate
    kind: calibrate
    params:
      input_basename: light
      fitseq: false
      # cfa, equalize_cfa, debayer, cosmetic all default-on for OSC.
    inputs:
      sequence: convert.sequence

  - id: resample
    kind: seq_resample
    params:
      input_basename: pp_light
      fitseq: false
      mode: full
      # Flip mode to 'draft' in the UI for fast iteration (~4x speedup);
      # back to 'full' for the final render. Both lineages stay cached.
    inputs:
      sequence: calibrate.sequence

  - id: offset
    kind: seq_offset
    params:
      input_basename: rs_pp_light
      fitseq: false
      pedestal: 0.01
    inputs:
      sequence: resample.sequence

  - id: bg_extract
    kind: seq_bg_extract
    params:
      input_basename: rs_pp_light
      fitseq: false
      degree: 1
      samples: 10
    inputs:
      sequence: offset.sequence

  - id: register
    kind: seq_register
    params:
      input_basename: bkg_rs_pp_light
      fitseq: false
      method: platesolve
    inputs:
      sequence: bg_extract.sequence

  - id: stack
    kind: seq_stack
    params:
      input_basename: r_bkg_rs_pp_light
      fitseq: false
      method: rej
      # rgb_equal / maximize / filter_included default-on.
    inputs:
      sequence: register.sequence

  - id: auto_crop
    kind: auto_crop
    # Trim the zero-fill border that registration leaves around the stack so
    # stretch + save read a smaller, all-real-data frame. Threshold + padding
    # live in advanced; the user toggles on/off if they want the full frame.
    params:
      enabled: true
      threshold: 0.001
      padding: 0
    inputs:
      image: stack.image

  - id: graxpert_bg
    kind: graxpert
    # GraXpert AI background extraction. Off by default; flip on if Siril's
    # polynomial bg_extract leaves residual gradient or you have a tough
    # light-pollution sky. Runs on linear (pre-stretch) data, where the
    # background model is cleanest.
    params:
      enabled: false
      mode: bg_extract
      smoothing: 0.0
      correction: Subtraction
    inputs:
      image: auto_crop.image

  - id: graxpert_denoise
    kind: graxpert
    # GraXpert AI denoise. Off by default. Strength 0.4-0.6 is the typical
    # sweet spot. Runs on linear data: GraXpert's noise model is fit on
    # pre-stretch distributions, and stretching after denoise keeps the
    # denoiser from over-smoothing the boosted shadow noise.
    params:
      enabled: false
      mode: denoise
      strength: 0.5
    inputs:
      image: graxpert_bg.image

  - id: stretch
    kind: stretch
    # Linear-domain processing ends here. Everything below operates on
    # stretched data (StarNet was trained on stretched 16-bit images).
    params:
      method: autostretch
      # autostretch with Siril defaults: linked, shadows_clip=-2.8, target_bg=0.25.
    inputs:
      image: graxpert_denoise.image

  - id: starnet_extract
    kind: starnet_extract
    # StarNet++ split into starless + stars. Off by default. When off, both
    # outputs are well-defined (starless=input, stars=zero) so the recombine
    # math at the end of the chain stays consistent.
    params:
      enabled: false
    inputs:
      image: stretch.image

  - id: starnet_replace
    kind: starnet_replace
    # Siril findstar+synthstar to regenerate clean Gaussian stars. Off by
    # default — passes the StarNet stars layer through unchanged.
    params:
      enabled: false
    inputs:
      starless: starnet_extract.starless
      stars: starnet_extract.stars
    # Surface this row only when the starless workflow is on — synthstar
    # regen is meaningless when stars haven't been extracted.
    ui_depends_on: starnet_extract

  - id: starnet_recombine
    kind: starnet_recombine
    # Recombine starless + (regenerated) stars. On by default; with extract
    # off the inputs are (input, zero-image) so this is a no-op identity.
    params:
      enabled: true
      blend: add
    inputs:
      starless: starnet_extract.starless
      stars: starnet_replace.image
    # Hide along with replace so the whole starless workflow lives or dies
    # as a unit; replace already gates on extract, so this transitively
    # disappears when extract is off.
    ui_depends_on: starnet_replace

  - id: crop
    kind: crop
    # Interactive composition crop. Off by default — flips on once the user
    # drags a rectangle in the project page UI. Coords are normalized [0,1]
    # so the box stays valid across resample modes.
    params:
      enabled: false
    inputs:
      image: starnet_recombine.image

  - id: save
    kind: save_image
    inputs:
      image: crop.image

outputs:
  image: save.image
  stacked: stack.image
  stretched: stretch.image
  auto_cropped: auto_crop.image
  starless: starnet_extract.starless
  stars: starnet_replace.image
  recombined: starnet_recombine.image
  cropped: crop.image
