id: calibrate_register_stack_narrowband
version: 1
description: |
  OSC narrowband (HOO/SHO/HSO etc.) pipeline for dual-band-filter smart
  telescope captures. Mirrors Naztronomy's Smart-Telescope-PP narrowband
  flow: the CFA sequence is kept un-debayered through calibration, then
  seqextract_HaOIII splits the Bayer pattern into Ha and OIII channels.
  Each channel is registered + stacked independently, the two stacks are
  shift-only aligned, OIII is normalized to Ha statistics, and the final
  RGB is composed via rgbcomp per the chosen palette.

  Why the chain looks the way it does:

  - calibrate runs with debayer=false so the Bayer mosaic stays intact.
    seqextract_HaOIII reads sub-pixel positions from the CFA pattern;
    debayering before extract destroys that information.
  - seq_resample sits between calibrate and narrowband_extract with
    mode=full (passthrough) as the default. Flip it to mode=draft for a
    fast preview pass: ~4x speedup at scale=0.5, at the cost of some
    Bayer-pattern smear that bleeds the Ha/OIII channels into each other.
    Acceptable for "is the composition working" checks, not for finals.
  - narrowband_extract does the expensive seqextract + per-channel
    register + per-channel stack + shift-align of the two stacks. Its
    outputs (the two aligned channel stacks) feed narrowband_compose,
    which is the cheap PixelMath + rgbcomp half. Splitting at that
    boundary means flipping the palette only re-runs the compose step.
  - Everything after narrowband_compose mirrors the OSC RGB template:
    auto_crop trims the registration nodata border, GraXpert bg/denoise
    operate on linear data, stretch transitions to non-linear, then
    StarNet++ extract -> replace -> recombine, optional composition crop,
    save 16-bit PNG.

  Inputs the Job must supply:
    convert.lights  -> a directory of raw .fits subs (typically a Dwarf 3
                       session shot with an L-eXtreme or similar dual-band
                       filter)
    calibrate.dark  -> a master_dark .fits matched on instrument /
                       exptime / gain / temp

nodes:
  - id: convert
    kind: convert_lights
    params:
      basename: light
      fitseq: false

  - id: calibrate
    kind: calibrate
    params:
      input_basename: light
      fitseq: false
      cfa: true
      equalize_cfa: true
      # debayer must stay off for narrowband: seqextract_HaOIII reads the
      # Bayer pattern directly. Debayering here would scramble the channel
      # split downstream.
      debayer: false
      cosmetic: true
    inputs:
      sequence: convert.sequence

  - id: resample
    kind: seq_resample
    # Default mode=full (passthrough). Flip to draft for ~4x faster preview
    # runs. Draft uses cubic interp which smears the Bayer pattern that
    # seqextract_HaOIII relies on, so channel separation degrades; fine for
    # composition / framing checks, not for finals.
    params:
      input_basename: pp_light
      fitseq: false
      mode: full
    inputs:
      sequence: calibrate.sequence

  - id: narrowband_extract
    kind: narrowband_extract
    # Phase 1 (expensive): split CFA into Ha + OIII, register + stack each,
    # shift-align the two stacks. Basename is rs_pp_light because
    # seq_resample prepends rs_ to its output frames (passthrough mode
    # hardlinks but still under the rs_ prefix).
    params:
      input_basename: rs_pp_light
      fitseq: false
    inputs:
      sequence: resample.sequence

  - id: narrowband_compose
    kind: narrowband_compose
    # Phase 2 (cheap): PixelMath OIII normalization + (optional synthetic
    # green for HSO) + rgbcomp per palette. Flipping `mode` only re-runs
    # this node, leaving the heavy extract step cached.
    params:
      mode: hoo
    inputs:
      ha: narrowband_extract.ha
      oiii: narrowband_extract.oiii

  - id: auto_crop
    kind: auto_crop
    # Trim the zero-fill border that the per-channel register passes leave
    # around the composed RGB so stretch + save work on a smaller, all-real
    # frame.
    params:
      enabled: true
      threshold: 0.001
      padding: 0
    inputs:
      image: narrowband_compose.image

  - id: graxpert_bg
    kind: graxpert
    # Optional AI background extraction on the linear narrowband composite.
    # Off by default; flip on if the OIII channel still shows residual
    # gradient after the per-channel stack normalization.
    params:
      enabled: false
      mode: bg_extract
      smoothing: 0.0
      correction: Subtraction
    inputs:
      image: auto_crop.image

  - id: graxpert_denoise
    kind: graxpert
    # Optional AI denoise. Narrowband stacks tend to be noisier than
    # broadband (the filter throws away most photons), so this is more
    # often useful here than in the OSC RGB template.
    params:
      enabled: false
      mode: denoise
      strength: 0.5
    inputs:
      image: graxpert_bg.image

  - id: stretch
    kind: stretch
    # Linear-domain ops end here. StarNet++ wants stretched input.
    params:
      method: autostretch
    inputs:
      image: graxpert_denoise.image

  - id: starnet_extract
    kind: starnet_extract
    # Off by default. Same passthrough convention as the OSC RGB template.
    params:
      enabled: false
    inputs:
      image: stretch.image

  - id: starnet_replace
    kind: starnet_replace
    params:
      enabled: false
    inputs:
      starless: starnet_extract.starless
      stars: starnet_extract.stars
    ui_depends_on: starnet_extract

  - id: starnet_recombine
    kind: starnet_recombine
    params:
      enabled: true
      blend: add
    inputs:
      starless: starnet_extract.starless
      stars: starnet_replace.image
    ui_depends_on: starnet_replace

  - id: crop
    kind: crop
    params:
      enabled: false
    inputs:
      image: starnet_recombine.image

  - id: save
    kind: save_image
    inputs:
      image: crop.image

outputs:
  image: save.image
  composed: narrowband_compose.image
  stretched: stretch.image
  auto_cropped: auto_crop.image
  starless: starnet_extract.starless
  stars: starnet_replace.image
  recombined: starnet_recombine.image
  cropped: crop.image
